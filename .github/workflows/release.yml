name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to release (for example, v5.7.29)'
        required: true
        type: string

# A release must only have one publisher. This also prevents a manually-created
# release and a repeated dispatch from attempting to publish the same version.
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  # Lets npm exchange the job's short-lived GitHub OIDC identity for a publish
  # credential. No long-lived npm token is stored in GitHub Secrets.
  id-token: write

jobs:
  prepare-manual-release:
    name: Create release commit, tag, and GitHub Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate requested version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must be a stable semver tag in the form vX.Y.Z.' >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi

          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const packageJson = JSON.parse(await readFile('package.json', 'utf8'));
          packageJson.version = process.env.VERSION.slice(1);
          await writeFile('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Commit and push release version
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "chore(release): $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes

  publish:
    name: Verify and publish to npm
    needs: prepare-manual-release
    # For a manually published GitHub Release, publish its tag. For a workflow
    # dispatch, publish the tag created by prepare-manual-release.
    if: >-
      always() &&
      ((github.event_name == 'release') ||
      (needs.prepare-manual-release.result == 'success'))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.prepare-manual-release.outputs.tag }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vX.Y.Z tags can be published; received $RELEASE_TAG." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure package and tag versions agree
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "v$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match tag ($VERSION)." >&2
            echo 'Use the workflow-dispatch release path, or tag a commit whose package.json already has that version.' >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run dist

      # npm Trusted Publishing requires npm CLI 11.5.1 or newer. npm publish
      # automatically uses the GitHub Actions OIDC token when npm is configured
      # to trust this workflow.
      - name: Install npm CLI with Trusted Publishing support
        run: npm install --global npm@^11.5.1

      - name: Publish package with npm Trusted Publishing
        run: npm publish --ignore-scripts

      - name: Fill an empty GitHub Release body with generated release notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });

            if (release.body?.trim()) {
              core.info('GitHub Release already has notes; leaving them unchanged.');
              return;
            }

            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tag,
              target_commitish: release.target_commitish,
            });
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              body: notes.body,
            });
