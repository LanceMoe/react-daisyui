on:
  push:
    branches:
      - main
name: release-please-pr

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v3
        id: release-please
        with:
          release-type: node
          package-name: '@lancemoe/react-daisyui'
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Miscellaneous","hidden":false},{"type":"refactor","section":"Miscellaneous","hidden":false},{"type":"docs","section":"Storybook","hidden":true}]'
          command: release-pr
      - uses: actions/github-script@v7
        if: ${{ steps.release-please.outputs.pr }}
        id: extract-branch
        env:
          PR: ${{ steps.release-please.outputs.pr }}
        with:
          result-encoding: string
          script: return JSON.parse(process.env.PR).headBranchName
      - uses: actions/checkout@v4
        if: ${{ steps.release-please.outputs.pr }}
        with:
          ref: ${{ steps.extract-branch.outputs.result }}
      - uses: pnpm/action-setup@v4
        if: ${{ steps.release-please.outputs.pr }}
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: ${{ steps.release-please.outputs.pr }}
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - run: pnpm install
        if: ${{ steps.release-please.outputs.pr }}
      - run: pnpm run docs
        if: ${{ steps.release-please.outputs.pr }}
      - uses: stefanzweifel/git-auto-commit-action@v4
        if: ${{ steps.release-please.outputs.pr }}
        with:
          commit_message: 'chore: update lockfile and storybook docs for release'

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          skip-github-pull-request: true
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}
